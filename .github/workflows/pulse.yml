name: Pulse

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch: # manual trigger for testing

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # Every value the pipeline needs resolves from 1Password through
      # .env.schema; this token is the only secret the repository holds.
      APP_ENV: production
      OP_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # After install: the 1Password plugin is a package in node_modules.
      # Exports the resolved values to the steps below, sensitive ones masked.
      - uses: dmno-dev/varlock-action@v1.0.1
      - run: bun run src/cli/index.ts
        env:
          # Lifts the unauthenticated api.github.com rate limit for the
          # Deno and Bun release lookups.
          GITHUB_TOKEN: ${{ github.token }}
