name: Deploy reader

# Publishes the reader SPA to Cloudflare Workers static assets after CI has
# passed on main. Only the built bundle is deployed -- the pipeline itself
# keeps running from pulse.yml, unchanged.
#
# This is gated on CI rather than triggered alongside it. Two workflows both
# firing on `push: main` race, and the deploy would publish a commit whose
# tests had failed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # For redeploying after fixing a secret, without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# Deploys are not raced, but nor are they cancelled halfway: an interrupted
# deploy whose successor then fails would leave main serving an older commit
# with nothing pointing at why.
concurrency:
  group: deploy-reader
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run checks out the default branch by default, not the
          # commit that was tested.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: voidzero-dev/setup-vp@v1.15.0
        with:
          node-version: "24"
          cache: true
      - run: vp install

      - name: Check the deploy is configured
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$ANON_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          # The public key and the secret key for a project sit next to each
          # other in the Supabase dashboard. Pasting the wrong one here would
          # publish a credential that bypasses row-level security to the
          # public internet, and every other check in this pipeline would
          # still pass. So identify the key rather than trusting that the
          # right one was pasted.
          #
          # Supabase has two formats. Current projects issue prefixed keys:
          # `sb_publishable_` is safe to ship, `sb_secret_` is not. Older
          # projects issue JWTs for both, told apart only by the role claim
          # inside, so that one has to be decoded.
          case "$ANON_KEY" in
            sb_publishable_*)
              ;;
            sb_secret_*)
              echo "::error::VITE_SUPABASE_ANON_KEY holds a Supabase secret key. It must be the publishable key: this value is compiled into a public bundle."
              exit 1
              ;;
            *)
              payload=$(printf '%s' "$ANON_KEY" | cut -d. -f2 | tr '_-' '/+')
              # JWT base64url drops padding; GNU base64 rejects it without.
              case $(( ${#payload} % 4 )) in
                2) payload="$payload==" ;;
                3) payload="$payload=" ;;
              esac
              role=$(printf '%s' "$payload" | base64 -d 2>/dev/null \
                | grep -o '"role"[[:space:]]*:[[:space:]]*"[^"]*"' \
                | sed 's/.*"\([^"]*\)"$/\1/')
              if [ "$role" != "anon" ]; then
                echo "::error::VITE_SUPABASE_ANON_KEY must be the publishable or anon key. It is neither an sb_publishable_ key nor a JWT with role 'anon' (role claim: '${role:-unreadable}'). This value is compiled into a public bundle."
                exit 1
              fi
              ;;
          esac

      - name: Build the reader
        env:
          # Keeps Varlock out of the build (see vite.config.ts): Vite reads
          # the two values below straight from the environment, and nothing
          # on this runner can reach 1Password.
          APP_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: vp run build

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned: an unpinned deploy resolves whatever wrangler npm serves
          # that morning, which is not the version this config was validated
          # against.
          wranglerVersion: "4.125.0"
